global:
  scrape_interval: 5s

scrape_configs:
    #AyurScan NestJS backend
  - job_name: "ayurscan-backend"
    metrics_path: "/api/v1/metrics"
    static_configs:
      - targets:
          - "backend:3000"

  #Ayurscan FastAPI Ai Service
  - job_name: "ayurscan-ai"
    metrics_path: "/metrics"
    static_configs:
      - targets:
          - "ai-service:8000"