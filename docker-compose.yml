services:

  # ==========================================
  # PostgreSQL Database
  # ==========================================
  postgres:
    image: postgres:16
    container_name: ayurscan-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ayurscan
      POSTGRES_PASSWORD: ayurscan_password
      POSTGRES_DB: ayurscan
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ayurscan -d ayurscan"]
      interval: 10s
      timeout: 5s
      retries: 5


  # ==========================================
  # Redis Cache
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: ayurscan-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5


  # ==========================================
  # AI Service
  # ==========================================
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    image: ayurscan-ai:1.0
    container_name: ayurscan-ai
    restart: unless-stopped
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
        ]
      interval: 10s
      timeout: 5s
      retries: 5


  # ==========================================
  # Backend API
  # ==========================================
  backend:
    image: ayurscan-backend:1.0
    container_name: ayurscan-backend
    restart: unless-stopped
    ports:
      - "3000:3000"

    env_file:
      - ./backend/.env

    environment:
      NODE_ENV: production
      PORT: 3000

      # Docker service-to-service communication
      DATABASE_URL: postgresql://ayurscan:ayurscan_password@postgres:5432/ayurscan
      REDIS_URL: redis://redis:6379
      REDIS_HOST: redis
      REDIS_PORT: 6379
      AI_SERVICE_URL: http://ai-service:8000

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai-service:
        condition: service_healthy


  # ==========================================
  # Prometheus
  # ==========================================
  prometheus:
    image: prom/prometheus:latest
    container_name: ayurscan-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    depends_on:
      - backend
      - ai-service


  # ==========================================
  # Grafana
  # ==========================================
  grafana:
    image: grafana/grafana:latest
    container_name: ayurscan-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus


# ==========================================
# Persistent Volumes
# ==========================================
volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
  